global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    system: phishguard

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: phishguard-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: phishguard-api

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

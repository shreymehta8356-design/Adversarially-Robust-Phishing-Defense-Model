[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phishguard"
version = "1.4.0"
description = "Adversarially Robust Phishing Defense using Email, URL and Behavioral Features"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "KES' Shroff College - T.Y. B.Sc. Artificial Intelligence" }]
keywords = ["phishing", "adversarial-robustness", "security", "machine-learning"]

# Runtime dependencies are deliberately small. Everything in `core` is required
# for training, evaluation and the adversarial suite. The API adds four packages.
dependencies = [
    # Deliberately small. pandas was removed after an audit found it was never
    # imported: an unused dependency is a supply-chain and version-conflict
    # surface for nothing in return.
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Optional transformer head (M3). The system trains and serves without it.
transformer = [
    "torch>=2.1",
    "transformers>=4.38",
]
# Experiment tracking. Guarded import - absent means tracking is a no-op.
tracking = [
    "mlflow>=2.10",
]
# Report figures (`phishguard figures`). Kept out of the core install so the
# service image stays small; the command says how to add it when missing.
report = [
    "matplotlib>=3.7",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "pip-audit>=2.7",
    "httpx>=0.26",
]

[project.scripts]
phishguard = "phishguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
phishguard = ["static/*.html", "resources/*.txt", "resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "slow: tests that train a model (deselect with '-m \"not slow\"')",
    "integration: tests that exercise the HTTP API",
    "security: authz / injection / privacy tests",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
# start.py is deliberately old-style (%-formatting, no f-strings) so that an
# interpreter too old to run PhishGuard can still say so; its subprocess calls
# run fixed commands inside the project's own environment.
"start.py" = ["UP031", "S603", "S110"]

[tool.coverage.run]
source = ["src/phishguard"]
branch = true

name: Release

# Push a tag like v1.3.0 to publish a release: the container image is built,
# smoke-tested and pushed to GitHub Container Registry, and a GitHub release is
# created with that version's section of CHANGELOG.md as its notes.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # create the release
      packages: write     # push the image to ghcr.io
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "$tag" = "$pkg" || { echo "tag v$tag does not match pyproject version $pkg"; exit 1; }

      - name: Extract the release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" {grab=1; next}
            grab && /^## \[/ {exit}
            grab {print}
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "no CHANGELOG section for $version"; exit 1; }
          cat release-notes.md

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name (registry paths must be lower case)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          load: true
          tags: ${{ steps.image.outputs.name }}:${{ github.ref_name }}

      - name: Smoke-test the image before publishing it
        run: |
          docker run -d --name pg-rel -p 8000:8000 \
            -e PG_ENVIRONMENT=dev -e PG_BOOTSTRAP_N=4000 \
            -e PG_API_KEYS="analyst:rel-analyst-key,admin:rel-admin-key" \
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}
          for i in $(seq 1 90); do
            curl -fsS http://localhost:8000/readyz >/dev/null 2>&1 && break
            sleep 10
          done
          curl -fsS http://localhost:8000/readyz
          curl -fsS -X POST http://localhost:8000/api/v1/scan \
            -H 'Content-Type: application/json' -H 'X-API-Key: rel-analyst-key' \
            -d '{"subject":"URGENT: verify your account","body":"Confirm your password at http://paypa1-secure.tk/login now."}' \
            | grep -qE '"band":"(BLOCK|REVIEW)"'
          docker rm -f pg-rel

      - name: Push
        run: |
          docker push ${{ steps.image.outputs.name }}:${{ github.ref_name }}
          docker tag ${{ steps.image.outputs.name }}:${{ github.ref_name }} ${{ steps.image.outputs.name }}:latest
          docker push ${{ steps.image.outputs.name }}:latest

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "PhishGuard ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md

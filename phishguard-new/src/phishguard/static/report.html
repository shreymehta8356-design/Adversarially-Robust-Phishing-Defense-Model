<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Report a Suspicious Email</title>
<style>
  :root {
    --bg: #f6f7f9; --surface: #ffffff; --surface-2: #f0f2f5; --border: #d9dee5;
    --text: #16202c; --text-dim: #5a6675; --accent: #1f5fbf; --accent-soft: #e8f0fc;
    --ok: #1a7f4b; --ok-soft: #e4f4ec; --warn: #a86a00; --warn-soft: #fdf1dd;
    --bad: #b3261e; --bad-soft: #fce9e8;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10151b; --surface: #171e26; --surface-2: #1f2831; --border: #2c3742;
      --text: #e6ebf1; --text-dim: #94a3b3; --accent: #6aa5f5; --accent-soft: #1a2635;
      --ok: #4ac98a; --ok-soft: #14261d; --warn: #e0a94a; --warn-soft: #2a2113;
      --bad: #f0736b; --bad-soft: #2c1717;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 var(--sans); }
  header { background: var(--surface); border-bottom: 1px solid var(--border); }
  .bar { max-width: 760px; margin: 0 auto; padding: 12px 16px; display: flex; gap: 12px;
         align-items: center; flex-wrap: wrap; }
  .brand { display: flex; gap: 9px; align-items: center; font-weight: 650; }
  .brand svg { width: 22px; height: 22px; color: var(--accent); }
  .brand small { color: var(--text-dim); font-weight: 400; font-size: 12.5px; }
  .spacer { flex: 1; }
  main { max-width: 760px; margin: 0 auto; padding: 20px 16px 48px; display: grid; gap: 16px; }
  h1 { font-size: 22px; margin: 4px 0 2px; text-wrap: balance; }
  .lede { color: var(--text-dim); margin: 0; max-width: 62ch; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 4px; }
  .help { color: var(--text-dim); font-size: 12.5px; font-weight: 400; }
  input, textarea, button { font: inherit; color: inherit; border-radius: 8px;
                            border: 1px solid var(--border); background: var(--surface); padding: 9px 11px; }
  input, textarea { width: 100%; }
  textarea { resize: vertical; min-height: 140px; }
  input:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button { cursor: pointer; font-weight: 600; background: var(--surface-2); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; padding: 10px 18px; }
  button:disabled { opacity: .55; cursor: not-allowed; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .chips label { margin: 0; font-weight: 500; font-size: 13.5px; display: inline-flex; gap: 7px;
                 align-items: center; padding: 7px 12px; border: 1px solid var(--border);
                 border-radius: 999px; cursor: pointer; background: var(--surface); }
  .chips input { width: auto; margin: 0; }
  .chips label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .row { display: grid; gap: 0 14px; }
  @media (min-width: 620px) { .row.two { grid-template-columns: 1fr 1fr; } }
  .receipt { border-left: 4px solid var(--ok); }
  .receipt h2 { margin: 0 0 4px; font-size: 16px; }
  .tips { margin: 10px 0 0; padding-left: 18px; color: var(--text-dim); font-size: 13.5px; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--text-dim); font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; }
  .mono { font-family: var(--mono); font-size: 12.5px; }
  .status { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 650;
            background: var(--surface-2); color: var(--text-dim); white-space: nowrap; }
  .status.done-phish { background: var(--bad-soft); color: var(--bad); }
  .status.done-safe { background: var(--ok-soft); color: var(--ok); }
  .status.working { background: var(--warn-soft); color: var(--warn); }
  .err { color: var(--bad); font-size: 13.5px; }
  .empty { color: var(--text-dim); text-align: center; padding: 18px; }
  .scroll { overflow-x: auto; }
  .keybox { display: flex; gap: 6px; align-items: center; }
  .keybox input { width: 220px; padding: 7px 10px; font-size: 13px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <path d="M12 2.5 4 6v6c0 4.6 3.2 8.6 8 9.5 4.8-.9 8-4.9 8-9.5V6l-8-3.5Z"/><path d="M12 8v5"/><path d="M12 16.5h.01"/>
      </svg>
      <span>PhishGuard <small>report an email</small></span>
    </div>
    <div class="spacer"></div>
    <div class="keybox">
      <input id="key" type="password" placeholder="Your reporting key" autocomplete="off" aria-label="Reporting key">
    </div>
  </div>
</header>

<main>
  <div>
    <h1>Report a suspicious email</h1>
    <p class="lede">Not sure about a message? Send it to the security team. Do not click its links,
      open its attachments or reply to it while it is being checked.</p>
  </div>

  <form class="card" id="form" autocomplete="off">
    <div class="row two">
      <div>
        <label for="from">Who sent it? <span class="help">as shown in your mail app</span></label>
        <input id="from" placeholder="IT Service Desk &lt;it-support@example.com&gt;" maxlength="512">
      </div>
      <div>
        <label for="subject">Subject</label>
        <input id="subject" placeholder="Your mailbox is full" maxlength="998">
      </div>
    </div>
    <label for="body">The message <span class="help">paste the text, including any links</span></label>
    <textarea id="body" maxlength="100000" required></textarea>

    <label>What made you suspicious?</label>
    <div class="chips" role="radiogroup">
      <label><input type="radio" name="cat" value="suspicious_link" checked> A link I wasn't expecting</label>
      <label><input type="radio" name="cat" value="unexpected_attachment"> An unexpected attachment</label>
      <label><input type="radio" name="cat" value="impersonation"> Someone pretending to be someone else</label>
      <label><input type="radio" name="cat" value="payment_request"> A payment or bank-details request</label>
      <label><input type="radio" name="cat" value="other"> Something else</label>
    </div>

    <div class="row two">
      <div>
        <label for="note">Anything else? <span class="help">optional</span></label>
        <input id="note" maxlength="500" placeholder="It asked me to sign in again">
      </div>
      <div>
        <label for="ref">Your reference <span class="help">optional &mdash; lets you find your reports; stored only as a one-way digest</span></label>
        <input id="ref" maxlength="128" placeholder="you@company.example">
      </div>
    </div>
    <div style="margin-top:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap">
      <button class="primary" id="send" type="submit">Send to the security team</button>
      <span class="err" id="error" role="alert"></span>
    </div>
  </form>

  <div class="card receipt" id="receipt" hidden aria-live="polite"></div>

  <section class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
      <h2 style="margin:0;font-size:16px">My reports</h2>
      <button id="refresh" type="button">Refresh</button>
    </div>
    <div class="scroll"><table>
      <thead><tr><th>Sent</th><th>Why</th><th>What happened</th><th>Case</th></tr></thead>
      <tbody id="mine"><tr><td colspan="4" class="empty">Enter your reporting key to see your reports.</td></tr></tbody>
    </table></div>
  </section>
</main>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const CAT = { suspicious_link: "Link", unexpected_attachment: "Attachment", impersonation: "Impersonation",
                payment_request: "Payment request", other: "Other" };
  try { $("key").value = sessionStorage.getItem("pg_report_key") || ""; } catch (_) {}
  try { $("ref").value = localStorage.getItem("pg_report_ref") || ""; } catch (_) {}

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g,
      (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  async function api(path, options = {}) {
    const key = $("key").value.trim();
    try { sessionStorage.setItem("pg_report_key", key); } catch (_) {}
    let res;
    try {
      res = await fetch(path, Object.assign({}, options, {
        headers: { "Content-Type": "application/json", "X-API-Key": key },
      }));
    } catch (_) { throw new Error("The reporting service cannot be reached right now."); }
    const data = await res.json().catch(() => ({}));
    if (res.status === 401) throw new Error("That reporting key was not recognised.");
    if (res.status === 429) throw new Error("Too many reports in a short time. Please wait a minute.");
    if (!res.ok) throw new Error((data && data.detail) ? String(data.detail) : "The report could not be sent.");
    return data;
  }

  function statusClass(r) {
    if (r.state !== "resolved") return "working";
    return /safe/i.test(r.status) ? "done-safe" : "done-phish";
  }

  async function loadMine() {
    const tbody = $("mine");
    if (!$("key").value.trim()) return;
    try {
      const ref = $("ref").value.trim();
      const out = await api("/api/v1/reports/mine" + (ref ? "?reporter_ref=" + encodeURIComponent(ref) : ""));
      if (!out.reports.length) {
        tbody.innerHTML = `<tr><td colspan="4" class="empty">No reports yet.</td></tr>`;
        return;
      }
      tbody.innerHTML = out.reports.map((r) => `
        <tr><td style="white-space:nowrap">${esc(new Date(r.received_at).toLocaleString([], { dateStyle: "medium", timeStyle: "short" }))}</td>
          <td>${esc(CAT[r.category] || r.category)}</td>
          <td><span class="status ${statusClass(r)}">${esc(r.status)}</span></td>
          <td class="mono">${esc(r.case_id)}</td></tr>`).join("");
    } catch (err) {
      tbody.innerHTML = `<tr><td colspan="4" class="empty">${esc(err.message)}</td></tr>`;
    }
  }

  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    $("error").textContent = "";
    if (!$("key").value.trim()) { $("error").textContent = "Enter your reporting key first (top right)."; return; }
    if (!$("body").value.trim()) { $("error").textContent = "Paste the message text first."; return; }
    const ref = $("ref").value.trim();
    try { localStorage.setItem("pg_report_ref", ref); } catch (_) {}
    const btn = $("send");
    btn.disabled = true; btn.textContent = "Sending…";
    try {
      const receipt = await api("/api/v1/reports", {
        method: "POST",
        body: JSON.stringify({
          message: { subject: $("subject").value, body: $("body").value, sender: $("from").value,
                     client_reference: "report-page" },
          category: (document.querySelector("input[name=cat]:checked") || {}).value || "other",
          note: $("note").value, reporter_ref: ref,
        }),
      });
      $("receipt").hidden = false;
      $("receipt").innerHTML = `
        <h2>Thank you — your report was received</h2>
        <p style="margin:0">${esc(receipt.message)} Your case number is <b class="mono">${esc(receipt.case_id)}</b>.</p>
        <ul class="tips">
          <li>Leave the original message alone: no clicks, no replies, no forwarding.</li>
          <li>If you already clicked a link or typed a password, tell the IT service desk now.</li>
          <li>The outcome will appear under <b>My reports</b> below.</li>
        </ul>`;
      $("form").reset();
      $("ref").value = ref;
      loadMine();
    } catch (err) {
      $("error").textContent = err.message;
    } finally {
      btn.disabled = false; btn.textContent = "Send to the security team";
    }
  });
  $("refresh").addEventListener("click", loadMine);
  $("key").addEventListener("change", loadMine);
  loadMine();
})();
</script>
</body>
</html>
